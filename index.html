<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YMC</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Yest Minds Co">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root {
    --ink: #1D1D1F;
    --dim: #6E6E73;
    --grey-bg: #F5F5F7;
    --hair: #D2D2D7;
    --mo: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Outfit", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; height: auto; }

  /* ---- lock screen ---- */
  #gate {
    min-height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 34px;
    padding: 40px 24px;
    text-align: center;
  }
  #gate .mark { width: 74px; color: var(--ink); }
  #gate h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  #gate .hint { margin: 8px 0 0; font-size: 15px; color: var(--dim); }
  form { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  input {
    width: 260px;
    padding: 13px 17px;
    font: 400 16px/1.2 var(--mo);
    letter-spacing: .12em;
    text-align: center;
    text-transform: uppercase;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--hair);
    border-radius: 12px;
    outline: none;
    transition: border-color .16s ease;
  }
  input:focus { border-color: var(--ink); }
  button {
    padding: 13px 26px;
    font: 500 16px/1.2 "Outfit", system-ui, sans-serif;
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: opacity .16s ease;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .45; cursor: default; }
  #msg { min-height: 20px; font-size: 14px; color: var(--dim); }
  #msg.bad { color: #B3261E; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
